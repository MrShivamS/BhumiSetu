<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#33513B">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https: http://localhost:* http://127.0.0.1:*; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; frame-src https://accounts.google.com; base-uri 'none'; form-action 'none'">
<title>Profile - BhumiSetu</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="site-header"><div class="header-inner" id="hdr"></div></header>
<main class="wrap" id="main">
<div class="page-title"><h2>Your profile</h2></div>
<div class="grid2">
  <section class="panel"><h3>Account details</h3><p class="sub">Contact details are verified with a one-time code.</p>
    <dl class="details" id="detailList"></dl>
    <p class="muted" id="verifyHint" hidden style="margin-top:12px">Log in once using your other contact to verify it too.</p></section>
  <section class="panel" id="kycCard"><h3 id="kycTitle">Aadhaar KYC</h3><p class="sub" id="kycSub"></p>
    <dl class="details" id="kycList"></dl><div id="kycActions" style="margin-top:18px"></div>
    <p class="muted" id="kycNote" style="margin-top:12px"></p></section>
</div>
<section class="panel" id="recentPanel" hidden><h3>Recent searches</h3><p class="sub">Searches on land records are logged against your account.</p><ul class="recent" id="recentList"></ul></section>
</main>
<footer>BhumiSetu - prototype for land record verification</footer>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
