<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#33513B">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https: http://localhost:* http://127.0.0.1:*; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; frame-src https://accounts.google.com; base-uri 'none'; form-action 'none'">
<title>Log in - BhumiSetu</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="site-header"><div class="header-inner" id="hdr"></div></header>
<main class="wrap narrow" id="main">
<div class="page-title"><h2 id="title">Log in</h2></div>
<div class="panel">
  <form id="loginForm" novalidate>
    <p class="sub">Use your registered mobile number or email. We'll send a one-time code.</p>
    <div class="field"><label for="ident">Mobile number or email</label><input id="ident" type="text" autocomplete="username"></div>
    <div class="field"><label>Send my code by</label><div class="seg" id="channels" role="radiogroup"></div>
      <div class="hint">The code goes to the email or mobile number saved on your account.</div></div>
    <div class="alert err" id="loginMsg" hidden></div>
    <button class="btn block" id="loginBtn" type="submit">Send code</button>
  </form>
  <div id="altAuth" hidden></div>
  <div id="otpStep" hidden></div>

  <p class="switch" id="switchRow">New here? <a href="register.html">Create an account</a></p>
  <p class="muted" id="regNote" hidden style="margin-top:14px">Sub-Registrar accounts are issued by the department.</p>
</div>
</main>
<footer>BhumiSetu - prototype for land record verification</footer>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/login.js"></script>
</body>
</html>
